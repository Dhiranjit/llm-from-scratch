[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Building neural networks from Bigram to GPT from scratch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "torch",
    "regex",
    "tqdm",
    "ipykernel>=7.4.0",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "ipywidgets>=8.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
